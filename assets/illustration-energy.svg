<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%" fill="none">
  <defs>
    <!-- Screen terminal gradient (Dark Forest IDE) -->
    <linearGradient id="laptopScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193825" />
      <stop offset="60%" stop-color="#112419" />
      <stop offset="100%" stop-color="#0a1810" />
    </linearGradient>

    <!-- Metallic laptop lid outer rim -->
    <linearGradient id="lidBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#345942" />
      <stop offset="100%" stop-color="#183324" />
    </linearGradient>

    <!-- Aluminum base deck gradients -->
    <linearGradient id="deckSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8f6f0" />
      <stop offset="100%" stop-color="#eae4d4" />
    </linearGradient>

    <linearGradient id="deckFrontLip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9c2b1" />
      <stop offset="50%" stop-color="#ded8cb" />
      <stop offset="100%" stop-color="#b8b09d" />
    </linearGradient>

    <!-- Amber filament switch glow -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a623" />
      <stop offset="100%" stop-color="#c87d1a" />
    </linearGradient>

    <!-- Realistic Drop Shadows -->
    <filter id="deskShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#183324" flood-opacity="0.16" />
    </filter>

    <filter id="socketShadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#183324" flood-opacity="0.10" />
    </filter>

    <filter id="noteShadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183324" flood-opacity="0.09" />
    </filter>
  </defs>

  <!-- ================= CANVAS BACKGROUND & ROOM ================= -->
  <rect width="600" height="480" rx="16" fill="#f8f6f0" />

  <!-- Architectural Wall Alignment Lines -->
  <line x1="30" y1="90" x2="570" y2="90" stroke="#e8e2d5" stroke-width="1.2" stroke-dasharray="6 6" />
  <line x1="30" y1="210" x2="570" y2="210" stroke="#e8e2d5" stroke-width="1.2" stroke-dasharray="6 6" />

  <!-- ================= DESK SURFACE (TABLETOP) ================= -->
  <!-- Top surface of desk in perspective -->
  <path d="M 20 280 L 580 280 L 545 455 L 55 455 Z" fill="#efe8db" />
  <line x1="20" y1="280" x2="580" y2="280" stroke="#183324" stroke-width="2.5" />
  <!-- Front wooden table edge -->
  <path d="M 55 455 L 545 455 L 545 466 L 55 466 Z" fill="#ded4c3" />

  <!-- ================= STOPKONTAK TEMBOK & COLOKAN (BAGUS & REALISTIS) ================= -->
  <!-- Stopkontak Dinding Ganda SNI (Mounted on Wall at Upper Right) -->
  <g transform="translate(440, 48)" filter="url(#socketShadow)">
    <!-- Base Mounting Box / Wall Plate -->
    <rect x="0" y="0" width="132" height="88" rx="10" fill="#ffffff" stroke="#ded7c7" stroke-width="2" />
    <!-- Beveled Plate Inner Border -->
    <rect x="3.5" y="3.5" width="125" height="81" rx="7" fill="none" stroke="#f4efe6" stroke-width="1.5" />
    
    <!-- Plate Top Label -->
    <text x="14" y="15" fill="#8c9a90" font-family="'Space Grotesk', sans-serif" font-size="6.5" font-weight="700" letter-spacing="0.08em">STOPKONTAK DINDING 220V</text>

    <!-- LEFT COMPARTMENT: OUTLET DENGAN COLOKAN / STEKER CHARGER TERTANCAP SEMPURNA -->
    <g transform="translate(10, 20)">
      <!-- Recessed Socket Cavity in Wall Plate -->
      <circle cx="27" cy="27" r="22" fill="#f4efe6" stroke="#d5cebe" stroke-width="1.5" />
      <circle cx="27" cy="27" r="19" fill="#eae3d3" />
      <!-- Earth Ground Metal Clips (Top & Bottom) -->
      <rect x="25" y="6" width="4" height="4" rx="1" fill="#c87d1a" />
      <rect x="25" y="44" width="4" height="4" rx="1" fill="#c87d1a" />

      <!-- STEKER CHARGER LAPTOP (BULAT DENGAN GRIP & KABEL KELUAR) TERTANCAP RAPI -->
      <g filter="url(#socketShadow)">
        <!-- Steker Outer Collar / Grip -->
        <circle cx="27" cy="27" r="16.5" fill="#183324" stroke="#0e1f16" stroke-width="1.5" />
        <!-- Steker Front Bevel Face -->
        <circle cx="27" cy="27" r="13" fill="#244935" />
        <!-- Ergonomic Finger Grip Ridges on Plug Body -->
        <line x1="20" y1="23" x2="34" y2="23" stroke="#356149" stroke-width="1.5" stroke-linecap="round" />
        <line x1="20" y1="27" x2="34" y2="27" stroke="#356149" stroke-width="1.5" stroke-linecap="round" />
        <line x1="20" y1="31" x2="34" y2="31" stroke="#356149" stroke-width="1.5" stroke-linecap="round" />
        
        <!-- Center Cable Relief Rubber Boot (Keluar ke bawah) -->
        <rect x="23" y="38" width="8" height="9" rx="2.5" fill="#161d18" />
        <rect x="24.5" y="44" width="5" height="5" rx="1.5" fill="#2c3530" />
      </g>
    </g>

    <!-- RIGHT COMPARTMENT: SAKELAR DINDING ON/OFF BERLAMPU AMBER -->
    <g transform="translate(76, 20)">
      <rect x="4" y="6" width="42" height="42" rx="6" fill="#f4efe6" stroke="#d5cebe" stroke-width="1.2" />
      <!-- Rocker Switch Border -->
      <rect x="8" y="10" width="34" height="34" rx="4" fill="#183324" />
      <!-- Rocker Switch Top Face (Illuminated Amber when ON) -->
      <rect x="11" y="13" width="28" height="15" rx="2" fill="url(#amberGlow)" />
      <circle cx="25" cy="20.5" r="2.2" fill="#ffffff" />
      <text x="14" y="38" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="7" font-weight="700">SAKELAR</text>
    </g>

    <!-- Status Tag below Socket -->
    <rect x="12" y="76" width="108" height="3" rx="1.5" fill="#e6decb" />
  </g>

  <!-- ================= KABEL CHARGER DARI TEMBOK KE LAPTOP ================= -->
  <!-- Kabel tebal elastis dari steker (477, 106), melengkung anggun ke meja, masuk ke port charger laptop (380, 276) -->
  <path d="M 477 106 C 477 150, 485 210, 465 255 C 445 295, 410 270, 385 276" 
        stroke="#161d18" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <!-- Bayangan kabel di atas meja -->
  <path d="M 465 290 C 445 305, 410 276, 385 279" 
        stroke="#183324" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.12" />

  <!-- ================= LAPTOP TEGAK & PROPORSIONAL (TIDAK TERLALU MIRING) ================= -->
  <g filter="url(#deskShadow)">
    
    <!-- 1. Contact Shadow di Bawah Bodi Laptop -->
    <ellipse cx="230" cy="398" rx="175" ry="18" fill="#183324" opacity="0.22" />

    <!-- 2. LAYAR LAPTOP TEGAK MENGHADAP DEPAN (ERSIH, TEGAK, MUDAH DIBACA) -->
    <!-- Sudut bukaan natural ~105°, tampak depan tegak, hanya sedikit trapesium halus -->
    <!-- Bingkai Luar Layar (Lid Frame) -->
    <path d="M 94 62 L 366 62 L 372 255 L 88 255 Z" fill="url(#lidBevel)" stroke="#102218" stroke-width="2" rx="6" />
    
    <!-- Bezel Layar Hitam (Black Screen Bezel) -->
    <path d="M 98 66 L 362 66 L 368 251 L 92 251 Z" fill="#0d1410" />

    <!-- Kaca Layar Aktif (Screen Glass) -->
    <path d="M 104 74 L 356 74 L 362 242 L 98 242 Z" fill="url(#laptopScreenGrad)" />

    <!-- Webcam Notch & Indikator Kamera (Tengah Atas Bezel) -->
    <circle cx="230" cy="69" r="2.2" fill="#4e6255" />
    <circle cx="230" cy="69" r="0.9" fill="#0a120e" />
    <circle cx="233.5" cy="69" r="0.6" fill="#4ade80" />

    <!-- KONTEN TERMINAL / KODE DI LAYAR LAPTOP -->
    <!-- Window Bar Terminal -->
    <rect x="107" y="78" width="246" height="18" rx="3" fill="#0a160f" opacity="0.85" />
    <circle cx="117" cy="87" r="3" fill="#e57373" />
    <circle cx="126" cy="87" r="3" fill="#ffb74d" />
    <circle cx="135" cy="87" r="3" fill="#81c784" />
    <text x="146" y="90" fill="#a4b7ab" font-family="'Space Grotesk', monospace" font-size="8" font-weight="600">terminal@laptop-pplg:~$</text>

    <!-- Teks Terminal / Output IDE -->
    <text x="110" y="112" fill="#d2dec5" font-family="monospace" font-size="9">> status_laptop: selesai dipakai praktik</text>
    <text x="110" y="128" fill="#f5a623" font-family="monospace" font-size="9">> persentase_baterai: 100% [PENUH]</text>
    <text x="110" y="144" fill="#e57373" font-family="monospace" font-size="9">> steker_tembok: masih tercolok (vampire load)</text>
    <text x="110" y="161" fill="#81c784" font-family="monospace" font-size="9">> sekolah: SMK Adiwiyata (tanpa AC)</text>
    
    <!-- Highlight Callout Box inside screen -->
    <rect x="110" y="174" width="240" height="28" rx="3" fill="#183324" stroke="#c87d1a" stroke-width="1" />
    <text x="116" y="186" fill="#fcf4e8" font-family="'Space Grotesk', sans-serif" font-size="7.5" font-weight="700">⚡ PERINGATAN SADAR WATT:</text>
    <text x="116" y="196" fill="#f5a623" font-family="monospace" font-size="7.5">Jangan cuma sleep! Cabut charger dari tembok!</text>

    <!-- Blinking Terminal Prompt -->
    <text x="110" y="218" fill="#81c784" font-family="monospace" font-size="9">> sadar_watt.cabut_colokan()</text>
    <rect x="268" y="210" width="5.5" height="9" fill="#f5a623" />
    <rect x="110" y="226" width="70" height="4" fill="#2d583f" rx="1" />

    <!-- 3. ENGSEL SILINDRIS LAPTOP (HINGE BAR) -->
    <!-- Menghubungkan layar tegak langsung ke bodi bawah keyboard -->
    <rect x="120" y="252" width="220" height="8" rx="4" fill="#1c3024" stroke="#0e1812" stroke-width="1.5" />
    <line x1="130" y1="256" x2="330" y2="256" stroke="#486e56" stroke-width="1" />

    <!-- 4. BODI BAWAH LAPTOP / KEYBOARD DECK (SLOPING FORWARD TO DESK) -->
    <!-- Permukaan Atas Deck (Unibody Silver-Cream Aluminum) -->
    <path d="M 80 258 L 380 258 L 406 382 L 54 382 Z" fill="url(#deckSurface)" stroke="#d5cebe" stroke-width="1.5" />

    <!-- Ketebalan Sisi & Depan Laptop (Front Edge Thickness) -->
    <path d="M 54 382 L 406 382 L 404 394 L 56 394 Z" fill="url(#deckFrontLip)" stroke="#c2baa7" stroke-width="1" />
    <!-- Coakan Pembuka Layar di Bibir Depan (Thumb Notch) -->
    <rect x="210" y="382" width="40" height="3" rx="1.5" fill="#a49c89" />

    <!-- 5. KEYBOARD WELL (LEKUKAN KEYBOARD LAPTOP TERINTEGRASI) -->
    <path d="M 98 266 L 362 266 L 350 328 L 110 328 Z" fill="#213d2c" rx="3" />

    <!-- Baris Tombol Keyboard Chiclet Laptop -->
    <!-- Function keys row -->
    <line x1="106" y1="273" x2="354" y2="273" stroke="#3b634a" stroke-width="2" stroke-dasharray="6 3" />
    <!-- Number keys row -->
    <line x1="108" y1="283" x2="352" y2="283" stroke="#ffffff" stroke-width="2.2" stroke-dasharray="8 3" />
    <!-- QWERTY row -->
    <line x1="110" y1="293" x2="350" y2="293" stroke="#ffffff" stroke-width="2.2" stroke-dasharray="9 3" />
    <!-- ASDF row -->
    <line x1="112" y1="303" x2="348" y2="303" stroke="#ffffff" stroke-width="2.2" stroke-dasharray="9 3" />
    <!-- Spacebar row (Amber accent on Spacebar) -->
    <line x1="115" y1="314" x2="160" y2="314" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="7 3" />
    <line x1="170" y1="314" x2="290" y2="314" stroke="#f5a623" stroke-width="3" stroke-linecap="round" />
    <line x1="300" y1="314" x2="342" y2="314" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="7 3" />

    <!-- 6. TRACKPAD LAPTOP TERINTEGRASI (CENTERED GLASS TRACKPAD) -->
    <rect x="185" y="336" width="90" height="36" rx="4" fill="#ffffff" stroke="#d5cebe" stroke-width="1.2" />
    <line x1="230" y1="360" x2="230" y2="370" stroke="#ded8cb" stroke-width="1" />

    <!-- 7. PORT PENGISIAN DAYA & KONEKTOR KABEL DI SISI KANAN LAPTOP -->
    <!-- Slot Port di Samping Kanan Bodi -->
    <rect x="378" y="273" width="5" height="5" rx="1" fill="#183324" />
    <!-- Kepala Jack Charger Colok ke Port Laptop -->
    <rect x="382" y="272" width="10" height="7" rx="1.5" fill="#c87d1a" />
    <!-- Indikator LED Pengisian Daya (Hijau = Baterai 100% Penuh) -->
    <circle cx="380" cy="269" r="1.5" fill="#4ade80" />
  </g>

  <!-- ================= STICKY NOTE: CATATAN LAB PPLG ================= -->
  <g transform="translate(425, 290) rotate(-4)" filter="url(#noteShadow)">
    <!-- Sticky Note Paper -->
    <rect x="0" y="0" width="138" height="92" rx="3" fill="#fcf4e8" stroke="#e8dfce" stroke-width="1.2" />
    
    <!-- Washi tape at top -->
    <rect x="46" y="-7" width="46" height="15" fill="#d5cebe" opacity="0.9" rx="2" />
    
    <!-- Note Heading -->
    <text x="14" y="22" fill="#9f5f0f" font-family="'Space Grotesk', sans-serif" font-size="8" font-weight="700" letter-spacing="0.06em">CATATAN LAB PPLG</text>
    <line x1="14" y1="27" x2="124" y2="27" stroke="#e8dfce" stroke-width="1" />
    
    <!-- Note Content -->
    <text x="14" y="44" fill="#161d18" font-family="sans-serif" font-size="9.5" font-weight="600">"Selesai ngoding,</text>
    <text x="14" y="60" fill="#161d18" font-family="sans-serif" font-size="9.5" font-weight="600">jangan cuma tutup laptop.</text>
    <text x="14" y="77" fill="#c87d1a" font-family="sans-serif" font-size="10" font-weight="700">Cabut chargernya!"</text>
  </g>

  <!-- Visual Callout Badge: "Perangkat Siswa: Laptop" -->
  <g transform="translate(40, 36)" filter="url(#socketShadow)">
    <rect x="0" y="0" width="142" height="26" rx="6" fill="#ffffff" stroke="#183324" stroke-width="1.5" />
    <circle cx="12" cy="13" r="3.5" fill="#c87d1a" />
    <text x="22" y="17" fill="#183324" font-family="'Space Grotesk', sans-serif" font-size="8.5" font-weight="700">UNIT LAPTOP SISWA</text>
  </g>
</svg>
